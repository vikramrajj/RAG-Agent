<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Troubleshooting Agent</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/themes.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>
    <div id="app">
        <aside class="sidebar" aria-label="Main navigation">
            <div class="logo">
                <i class="ri-customer-service-2-line"></i>
                <span>SAT Agent</span>
            </div>

            <nav class="nav-items">
                <button class="nav-item active" data-tool="chat">
                    <i class="ri-chat-3-line"></i>
                    <span>Chat</span>
                </button>
                <button class="nav-item" data-tool="outlook">
                    <i class="ri-mail-line"></i>
                    <span>Outlook</span>
                </button>
                <button class="nav-item" data-tool="teams">
                    <i class="ri-team-line"></i>
                    <span>Teams</span>
                </button>
                <button class="nav-item" data-tool="browser">
                    <i class="ri-global-line"></i>
                    <span>Browser</span>
                </button>
                <button class="nav-item" data-tool="shopping">
                    <i class="ri-shopping-cart-line"></i>
                    <span>Shop</span>
                </button>
            </nav>

            <div class="voice-controls">
                <button id="voiceBtn" class="voice-button">
                    <i class="ri-mic-line"></i>
                </button>
                <span class="voice-status">Click to speak</span>
            </div>

            <div class="status-indicator" id="agentStatus">
                <span class="status-dot"></span>
                <span class="status-text">Agent Ready</span>
            </div>
        </aside>

        <main class="chat-container">
            <header class="chat-header">
                <div class="header-title">
                    <h1 class="app-title">Super Troubleshooting Assistant</h1>
                    <span class="model-info">Powered by Mistral</span>
                </div>
                <div class="header-actions" id="toolActions"></div>
            </header>

            <section class="messages" id="messages" aria-live="polite"></section>

            <div class="suggestion-chips" id="suggestionChips">
                <!-- Dynamic suggestion chips will be added here -->
            </div>

            <form class="input-area" id="inputForm">
                <div class="input-wrapper glass-effect">
                    <textarea id="userInput" placeholder="Type a message or use voice input..." rows="1"
                        aria-label="Message input"></textarea>
                    <div class="input-actions">
                        <button type="button" id="voiceInputBtn" class="action-button" aria-label="Voice input">
                            <i class="ri-mic-line"></i>
                        </button>
                        <button type="submit" id="sendBtn" class="action-button" aria-label="Send message">
                            <i class="ri-send-plane-line"></i>
                        </button>
                    </div>
                </div>
            </form>
        </main>

        <!-- Action Panels -->
        <div class="action-panels" id="actionPanels">
            <div class="panel" data-panel="outlook">
                <div class="panel-header">
                    <h3>Outlook Actions</h3>
                    <button class="close-panel"><i class="ri-close-line"></i></button>
                </div>
                <div class="panel-content">
                    <button class="action-btn" data-action="openOWA">
                        <i class="ri-browser-line"></i>
                        Open in OWA
                    </button>
                    <button class="action-btn" data-action="checkStatus">
                        <i class="ri-error-warning-line"></i>
                        Check Service Status
                    </button>
                </div>
            </div>

            <div class="panel" data-panel="teams">
                <div class="panel-header">
                    <h3>Teams Actions</h3>
                    <button class="close-panel"><i class="ri-close-line"></i></button>
                </div>
                <div class="panel-content">
                    <button class="action-btn" data-action="openTeamsWeb">
                        <i class="ri-browser-line"></i>
                        Open Teams Web
                    </button>
                    <button class="action-btn" data-action="checkTeamsStatus">
                        <i class="ri-error-warning-line"></i>
                        Check Teams Status
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <script type="module" src="/static/js/app.js"></script>
    <script type="module" src="/static/js/voice.js"></script>
    <script type="module" src="/static/js/agents.js"></script>
</body>

</html>
